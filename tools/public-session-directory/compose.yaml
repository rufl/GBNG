services:
  directory:
    build:
      context: .
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "47800"
      - --trusted-proxy
      - ${DIRECTORY_PROXY_IP:-172.30.0.2}
      - --relay-bind
      - ${RELAY_BIND:-0.0.0.0}
      - --relay-control-port
      - "47801"
      - --relay-public-address
      - ${RELAY_PUBLIC_ADDRESS:?Set RELAY_PUBLIC_ADDRESS in .env}
      - --relay-data-port-start
      - "48000"
      - --relay-data-port-end
      - "48999"
    expose:
      - "47800"
    ports:
      - "47801:47801/udp"
      - "48000-48999:48000-48999/udp"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      backend:
        ipv4_address: ${DIRECTORY_SERVICE_IP:-172.30.0.3}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:47800/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      directory:
        condition: service_healthy
    environment:
      DIRECTORY_DOMAIN: ${DIRECTORY_DOMAIN:?Set DIRECTORY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: ${DIRECTORY_PROXY_IP:-172.30.0.2}

networks:
  backend:
    ipam:
      config:
        - subnet: ${DIRECTORY_SUBNET:-172.30.0.0/24}

volumes:
  caddy_data:
  caddy_config:
